<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b3d">
  <title>Royal Keepsake — Open / Close on Touch</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap');

body {
  position: relative;
  box-sizing: border-box;
  padding: 24px;
  perspective: 900px;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  display: flex;
  background: radial-gradient(circle at 50% 42%, #26396d 0%, #101b3d 58%, #080f27 100%);
  overflow: hidden;
}

#magic-particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}
.jewellery-box {
  z-index: 1;
  position: relative;
  width: 170px;
  height: 80px;
  transform: translateX(-15px);
  filter: drop-shadow(0 18px 28px rgba(0,0,0,.48));
}

input#open {
  display: none;
}


/* Fine gold necklace with a sapphire pendant */
.necklace {
  position: absolute; z-index: 2; width: 170px; height: 112px;
  left: -70px; top: -31px; opacity: 0;
  transform: translateY(10px) scale(.82);
  transform-origin: 50% 70%;
  transition: opacity .65s ease .18s, transform .75s cubic-bezier(.2,.8,.2,1) .12s;
  pointer-events: none;
}
.necklace svg { width: 100%; height: 100%; overflow: visible; }
.necklace-chain {
  fill: none; stroke: #d9b86a; stroke-width: 2.2; stroke-linecap: round;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
.pendant-frame { fill: #d9b86a; stroke: #fff0c5; stroke-width: 1; }
.pendant-gem { fill: url(#sapphire); stroke: #f7e5b4; stroke-width: 1; }
.pendant-glint { fill: rgba(255,255,255,.8); }
#open:checked ~ .necklace { opacity: 1; transform: translateY(0) scale(1); }
.open {
  position: absolute;
  z-index: 5;
  background: linear-gradient(145deg, #263b70, #14234d 65%, #0c1737);
  width: 170px;
  height: 40px;
  border-radius: 30px 30px 0 0;
  left: -70px;
  top: -10px;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  cursor: pointer;
}

.bottom {
  position: absolute;
  z-index: 5;
  background: linear-gradient(145deg, #263b70, #14234d 65%, #0c1737);
  width: 170px;
  height: 40px;
  box-shadow: 0 -10px #09132f, inset 0 2px 0 rgba(231,198,116,.55);
  border-radius: 0 0 15px 15px;
  top: 40px;
  left: -70px;
  transition: .65s cubic-bezier(.2,.75,.2,1);
}

.bottom:before {
  content: "";
  position: absolute;
  border-radius: 50%;
  width: 10px;
  height: 10px;
  background-color: #d6b66d;
  top: 13px;
  left: 13px;
  box-shadow: 15px 0 #d6b66d, 30px 0 #d6b66d, 45px 0 #d6b66d, 60px 0 #d6b66d, 75px 0 #d6b66d, 90px 0 #d6b66d, 105px 0 #d6b66d, 120px 0 #d6b66d, 135px 0 #d6b66d;
}

#open:checked + .open {
  transform: translateY(-40px);
}

#open:checked ~ .bottom {
  transform: translateY(45px);
}

.inner-top {
  position: absolute;
  width: 150px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 50px 10px;
  border-color: transparent transparent #1b2b59 transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: -70px;
  top: 40px;
  transform: rotateX(85deg);
}

.inner-top:before {
  content: "";
  position: absolute;
  width: 130px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 50px 10px;
  border-color: transparent transparent #d6b66d transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: 0;
  top: 0;
}

#open:checked ~ .inner-top {
  transform: rotateX(180deg);
}

.inner-bottom {
  position: absolute;
  width: 150px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 60px 10px;
  border-color: transparent transparent #17264f transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: -70px;
  top: 40px;
  transform: rotateX(85deg);
}

.inner-bottom:before {
  content: "";
  position: absolute;
  width: 130px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 60px 10px;
  border-color: transparent transparent #d8c49a transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: 0;
  top: 0;
}

#open:checked ~ .inner-bottom {
  transform: rotateX(-40deg);
}

.details {
  position: absolute;
  width: 132px;
  background-color: #d8c49a;
  border-radius: 20px 20px 0 0;
  height: 10px;
  left: -51px;
  top: 35px;
}

.text {
  position: absolute; z-index: 7; color: #f5e8c6;
  font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600;
  font-size: clamp(22px, 6vw, 28px); line-height: 1.12; letter-spacing: .3px;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
  transition: opacity .7s ease .25s, transform .7s ease .25s;
  width: min(330px, 88vw); text-align: center; top: -174px; left: 50%;
  transform: translateX(-50%) translateY(10px); opacity: 0;
}

#open:checked ~ .text {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
  
@media (max-width: 360px) {
  .text { top: -165px; font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
  <canvas id="magic-particles" aria-hidden="true"></canvas>
  <audio id="opening-music" src="music.mp3" preload="auto" loop></audio>
  <div class="jewellery-box">
    <input id="open" type="checkbox">
    <label class="open" for="open" aria-label="Touch to open or close the jewellery box"></label>
    <div class="bottom"></div>
    <div class="inner-top"></div>
    <div class="inner-bottom"></div>
    <div class="text">No days pass without I think about you,<br> keep this.</div>
    <div class="necklace" aria-hidden="true">
      <svg viewBox="0 0 170 112" role="img" aria-label="Gold necklace with sapphire pendant">
        <defs>
          <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a9c8f2"/>
            <stop offset=".42" stop-color="#315b9d"/>
            <stop offset="1" stop-color="#101f4b"/>
          </linearGradient>
        </defs>
        <path class="necklace-chain" d="M18 5 C30 47 53 67 85 73 C117 67 140 47 152 5"/>
        <path class="necklace-chain" d="M18 5 C30 47 53 67 85 73 C117 67 140 47 152 5" stroke-dasharray="1 3" stroke-width="1"/>
        <path class="pendant-frame" d="M85 69 L99 84 L85 105 L71 84 Z"/>
        <path class="pendant-gem" d="M85 73 L95 84 L85 100 L75 84 Z"/>
        <path class="pendant-glint" d="M85 74 L90 84 L85 82 Z"/>
        <circle cx="85" cy="70" r="3.5" fill="#f4dfaa" stroke="#b18a42" stroke-width="1"/>
      </svg>
    </div>
  </div>
  <script>
(() => {
  const checkbox = document.getElementById('open');
  const music = document.getElementById('opening-music');
  const canvas = document.getElementById('magic-particles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, particles = [], animationId = null;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    createParticles();
    drawParticles();
  }

  function createParticles() {
    const count = Math.min(65, Math.max(28, Math.floor(width * height / 15000)));
    particles = Array.from({length: count}, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: .7 + Math.random() * 2.1,
      speed: .12 + Math.random() * .48,
      drift: (Math.random() - .5) * .35,
      phase: Math.random() * Math.PI * 2,
      alpha: .25 + Math.random() * .65
    }));
  }

  function drawParticles() {
    ctx.clearRect(0, 0, width, height);
    const active = checkbox.checked;
    particles.forEach(p => {
      const shimmer = .55 + Math.sin(p.phase) * .35;
      const alpha = active ? p.alpha * shimmer : p.alpha * .16;
      ctx.beginPath();
      ctx.fillStyle = `rgba(244, 218, 157, ${alpha})`;
      ctx.shadowColor = 'rgba(238, 207, 132, .8)';
      ctx.shadowBlur = active ? 10 : 3;
      ctx.arc(p.x, p.y, active ? p.r : p.r * .7, 0, Math.PI * 2);
      ctx.fill();

      if (active && p.r > 1.5) {
        ctx.strokeStyle = `rgba(255, 241, 204, ${alpha * .55})`;
        ctx.lineWidth = .7;
        ctx.beginPath();
        ctx.moveTo(p.x - 4, p.y);
        ctx.lineTo(p.x + 4, p.y);
        ctx.moveTo(p.x, p.y - 4);
        ctx.lineTo(p.x, p.y + 4);
        ctx.stroke();
      }

      if (active && !reduceMotion) {
        p.y -= p.speed;
        p.x += p.drift;
        p.phase += .035;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
      }
    });
    ctx.shadowBlur = 0;
    if (active && !reduceMotion) animationId = requestAnimationFrame(drawParticles);
    else animationId = null;
  }

  function updateOpening() {
    if (checkbox.checked) {
      // Audio playback is initiated by the user's tap on the lid.
      music.volume = 0.55;
      const playPromise = music.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
          // Some browsers may require a second explicit interaction to start audio.
        });
      }
      if (!reduceMotion && animationId === null) animationId = requestAnimationFrame(drawParticles);
      else drawParticles();
    } else {
      music.pause();
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
      drawParticles();
    }
  }

  checkbox.addEventListener('change', updateOpening);
  window.addEventListener('resize', resizeCanvas, {passive: true});
  resizeCanvas();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b3d">
  <meta name="color-scheme" content="dark">
  <title>Royal Keepsake</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap');

:root { --k: 1.6; } /* échelle de l'écrin, recalculée en JS selon l'écran */

* { -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body {
  position: relative;
  box-sizing: border-box;
  height: 100vh; height: 100dvh;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: radial-gradient(circle at 50% 42%, #26396d 0%, #101b3d 58%, #080f27 100%);
  overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}

#magic-particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

/* ---------- Message et indice (hors de l'écrin pour rester lisibles) ---------- */
.msg {
  position: relative; z-index: 7; margin: 0 0 10px; min-height: 2.4em;
  display: flex; align-items: flex-end; justify-content: center;
  color: #f5e8c6; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600;
  font-size: clamp(22px, 6.6vw, 30px); line-height: 1.14; letter-spacing: .3px; text-align: center;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
  width: min(340px, 90vw);
  opacity: 0; transform: translateY(10px);
  transition: opacity .7s ease .25s, transform .7s ease .25s;
}
body.is-open .msg { opacity: 1; transform: none; }

.hint {
  position: relative; z-index: 8; margin: 10px 0 0; min-height: 44px; padding: 0 20px;
  display: inline-flex; align-items: center;
  color: #f5e8c6; font: 600 17px 'Cormorant Garamond', Georgia, serif; letter-spacing: 1.2px;
  text-shadow: 0 2px 10px rgba(0,0,0,.55);
  border: 1px solid rgba(217,184,106,.45); border-radius: 999px; background: rgba(255,255,255,.04);
  opacity: .85; transition: opacity .3s ease;
}
.hint.swap { opacity: 0; }

/* ---------- Zone qui met l'écrin à l'échelle ---------- */
.stage {
  position: relative; z-index: 1; flex: none;
  width: calc(170px * var(--k)); height: calc(175px * var(--k));
}
.scale {
  position: absolute; left: 50%; top: calc(50px * var(--k));
  transform: scale(var(--k)); transform-origin: 0 0;
}

/* ---------- ÉCRIN : animation d'origine, inchangée ---------- */
.jewellery-box {
  z-index: 1;
  position: relative;
  width: 170px;
  height: 80px;
  transform: translateX(-15px);
  filter: drop-shadow(0 18px 28px rgba(0,0,0,.48));
}

input#open { display: none; }

/* Fine gold necklace with a sapphire pendant */
.necklace {
  position: absolute; z-index: 2; width: 170px; height: 112px;
  left: -70px; top: -31px; opacity: 0;
  transform: translateY(10px) scale(.82);
  transform-origin: 50% 70%;
  transition: opacity .65s ease .18s, transform .75s cubic-bezier(.2,.8,.2,1) .12s;
  pointer-events: auto;
  cursor: zoom-in;
}
.necklace svg { width: 100%; height: 100%; overflow: visible; }
.necklace-chain {
  fill: none; stroke: #d9b86a; stroke-width: 2.2; stroke-linecap: round;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
}
.pendant-frame { fill: #d9b86a; stroke: #fff0c5; stroke-width: 1; }
.pendant-gem { fill: url(#sapphire); stroke: #f7e5b4; stroke-width: 1; }
.pendant-glint { fill: rgba(255,255,255,.8); }
#open:checked ~ .necklace { opacity: 1; transform: translateY(0) scale(1); }

.open {
  position: absolute;
  z-index: 5;
  background: linear-gradient(145deg, #263b70, #14234d 65%, #0c1737);
  width: 170px;
  height: 40px;
  border-radius: 30px 30px 0 0;
  left: -70px;
  top: -10px;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  cursor: pointer;
}
/* zone tactile élargie (invisible) */
.open::after { content: ""; position: absolute; inset: -14px -10px -6px; }

.bottom {
  position: absolute;
  z-index: 5;
  background: linear-gradient(145deg, #263b70, #14234d 65%, #0c1737);
  width: 170px;
  height: 40px;
  box-shadow: 0 -10px #09132f, inset 0 2px 0 rgba(231,198,116,.55);
  border-radius: 0 0 15px 15px;
  top: 40px;
  left: -70px;
  transition: .65s cubic-bezier(.2,.75,.2,1);
}
.bottom:before {
  content: "";
  position: absolute;
  border-radius: 50%;
  width: 10px;
  height: 10px;
  background-color: #d6b66d;
  top: 13px;
  left: 13px;
  box-shadow: 15px 0 #d6b66d, 30px 0 #d6b66d, 45px 0 #d6b66d, 60px 0 #d6b66d, 75px 0 #d6b66d, 90px 0 #d6b66d, 105px 0 #d6b66d, 120px 0 #d6b66d, 135px 0 #d6b66d;
}

#open:checked + .open { transform: translateY(-40px); }
#open:checked ~ .bottom { transform: translateY(45px); }

.inner-top {
  position: absolute;
  width: 150px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 50px 10px;
  border-color: transparent transparent #1b2b59 transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: -70px;
  top: 40px;
  transform: rotateX(85deg);
}
.inner-top:before {
  content: "";
  position: absolute;
  width: 130px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 50px 10px;
  border-color: transparent transparent #d6b66d transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: 0;
  top: 0;
}
#open:checked ~ .inner-top { transform: rotateX(180deg); }

.inner-bottom {
  position: absolute;
  width: 150px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 60px 10px;
  border-color: transparent transparent #17264f transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: -70px;
  top: 40px;
  transform: rotateX(85deg);
}
.inner-bottom:before {
  content: "";
  position: absolute;
  width: 130px;
  height: 0;
  border-style: solid;
  border-width: 0 10px 60px 10px;
  border-color: transparent transparent #d8c49a transparent;
  transition: .65s cubic-bezier(.2,.75,.2,1);
  transform-origin: top;
  left: 0;
  top: 0;
}
#open:checked ~ .inner-bottom { transform: rotateX(-40deg); }

.details {
  position: absolute;
  width: 132px;
  background-color: #d8c49a;
  border-radius: 20px 20px 0 0;
  height: 10px;
  left: -51px;
  top: 35px;
}

/* ---------- Vue agrandie du collier ---------- */
.zoom-view {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
  justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  box-sizing: border-box;
  background: rgba(5, 10, 29, .88); -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
  opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease;
}
.zoom-view.visible { opacity: 1; visibility: visible; }
.zoom-card { text-align: center; color: #f5e8c6; width: min(440px, 100%); }
.zoom-caption { font: 600 clamp(22px, 6.4vw, 26px) 'Cormorant Garamond', Georgia, serif; margin: 0 0 18px; }
.zoom-necklace { width: min(360px, 90vw); margin: 0 auto; }
.zoom-necklace svg { width: 100%; height: auto; overflow: visible; }
.zoom-necklace .pendant-frame { stroke-width: 1.5; }
.zoom-hint { color: #d8c49a; font: 15px Georgia, serif; opacity: .8; margin-top: 14px; }
.zoom-close {
  position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
  width: 48px; height: 48px;
  border: 1px solid rgba(230,203,145,.6); border-radius: 50%;
  color: #f5e8c6; background: rgba(255,255,255,.08); font-size: 30px; line-height: 1; cursor: pointer;
}
.music-retry {
  position: fixed; z-index: 30; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  min-height: 48px; padding: 0 22px; border: 1px solid #d9b86a; border-radius: 24px;
  color: #f5e8c6; background: #14234d; font: 16px Georgia, serif; cursor: pointer;
}
.music-retry[hidden] { display: none; }

/* Téléphone couché : message à gauche, écrin à droite */
@media (orientation: landscape) and (max-height: 500px) {
  body { flex-direction: row; gap: 24px; }
  .msg { margin: 0; width: min(34vw, 300px); font-size: clamp(20px, 3.6vw, 28px); align-items: center; }
  .hint { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); margin: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
  </style>
</head>
<body>
  <canvas id="magic-particles" aria-hidden="true"></canvas>
  <audio id="opening-music" src="./music.mp3" preload="auto" loop></audio>

  <p class="msg" lang="en">No days pass without I think about you,<br> keep this.</p>

  <div class="stage">
    <div class="scale">
      <div class="jewellery-box">
        <input id="open" type="checkbox">
        <label class="open" for="open" aria-label="Touche pour ouvrir ou fermer l'écrin"></label>
        <div class="bottom"></div>
        <div class="inner-top"></div>
        <div class="inner-bottom"></div>
        <div class="necklace" aria-hidden="true">
          <svg viewBox="0 0 170 112" role="img" aria-label="Collier en or avec pendentif saphir">
            <defs>
              <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#a9c8f2"/>
                <stop offset=".42" stop-color="#315b9d"/>
                <stop offset="1" stop-color="#101f4b"/>
              </linearGradient>
              <clipPath id="photoPendantClip">
                <path d="M85 76 L93 84 L85 97 L77 84 Z"/>
              </clipPath>
            </defs>
            <path class="necklace-chain" d="M18 5 C30 47 53 67 85 73 C117 67 140 47 152 5"/>
            <path class="necklace-chain" d="M18 5 C30 47 53 67 85 73 C117 67 140 47 152 5" stroke-dasharray="1 3" stroke-width="1"/>
            <path class="pendant-frame" d="M85 69 L99 84 L85 105 L71 84 Z"/>
            <path class="pendant-gem" d="M85 73 L95 84 L85 100 L75 84 Z"/>
            <image href="./image.jpg" x="77" y="76" width="16" height="20"
                   preserveAspectRatio="xMidYMid slice" clip-path="url(#photoPendantClip)"/>
            <path class="pendant-glint" d="M85 74 L90 84 L85 82 Z"/>
            <circle cx="85" cy="70" r="3.5" fill="#f4dfaa" stroke="#b18a42" stroke-width="1"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint" aria-live="polite">Touche l’écrin</p>

  <div class="zoom-view" id="zoom-view" aria-hidden="true">
    <button class="zoom-close" id="zoom-close" type="button" aria-label="Fermer">×</button>
    <div class="zoom-card">
      <p class="zoom-caption">A little piece of you, close to my heart</p>
      <div class="zoom-necklace" id="zoom-necklace"></div>
      <p class="zoom-hint">Touche en dehors du pendentif pour fermer</p>
    </div>
  </div>
  <button class="music-retry" id="music-retry" type="button" hidden>♫ Activer la musique</button>

<script>
(() => {
  const checkbox = document.getElementById('open');
  const music = document.getElementById('opening-music');
  const canvas = document.getElementById('magic-particles');
  const ctx = canvas.getContext('2d');
  const necklace = document.querySelector('.necklace');
  const zoomView = document.getElementById('zoom-view');
  const zoomNecklace = document.getElementById('zoom-necklace');
  const zoomClose = document.getElementById('zoom-close');
  const musicRetry = document.getElementById('music-retry');
  const hint = document.getElementById('hint');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let width = 0, height = 0, particles = [], animationId = null;

  /* Échelle de l'écrin selon l'écran (l'animation elle-même ne change pas) */
  function fitBox() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const landscape = vw > vh && vh <= 500;
    const k = landscape
      ? Math.min(vw * .38 / 170, vh * .78 / 175)
      : Math.min(vw * .86 / 170, (vh - 190) / 175, 3);
    document.documentElement.style.setProperty('--k', Math.max(.9, k).toFixed(3));
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fitBox();
    createParticles();
    drawParticles();
  }

  function createParticles() {
    const count = Math.min(48, Math.max(28, Math.floor(width * height / 15000)));
    particles = Array.from({length: count}, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: .7 + Math.random() * 2.1,
      speed: .12 + Math.random() * .48,
      drift: (Math.random() - .5) * .35,
      phase: Math.random() * Math.PI * 2,
      alpha: .25 + Math.random() * .65
    }));
  }

  function drawParticles() {
    ctx.clearRect(0, 0, width, height);
    const active = checkbox.checked;
    particles.forEach(p => {
      const shimmer = .55 + Math.sin(p.phase) * .35;
      const alpha = active ? p.alpha * shimmer : p.alpha * .16;
      ctx.beginPath();
      ctx.fillStyle = `rgba(244, 218, 157, ${alpha})`;
      ctx.shadowColor = 'rgba(238, 207, 132, .8)';
      ctx.shadowBlur = active ? 10 : 3;
      ctx.arc(p.x, p.y, active ? p.r : p.r * .7, 0, Math.PI * 2);
      ctx.fill();

      if (active && p.r > 1.5) {
        ctx.strokeStyle = `rgba(255, 241, 204, ${alpha * .55})`;
        ctx.lineWidth = .7;
        ctx.beginPath();
        ctx.moveTo(p.x - 4, p.y);
        ctx.lineTo(p.x + 4, p.y);
        ctx.moveTo(p.x, p.y - 4);
        ctx.lineTo(p.x, p.y + 4);
        ctx.stroke();
      }

      if (active && !reduceMotion) {
        p.y -= p.speed;
        p.x += p.drift;
        p.phase += .035;
        if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
      }
    });
    ctx.shadowBlur = 0;
    if (active && !reduceMotion && !document.hidden) animationId = requestAnimationFrame(drawParticles);
    else animationId = null;
  }

  function setHint(text) {
    hint.classList.add('swap');
    setTimeout(() => { hint.textContent = text; hint.classList.remove('swap'); }, 220);
  }

  function updateOpening() {
    document.body.classList.toggle('is-open', checkbox.checked);
    setHint(checkbox.checked ? 'Touche le collier' : 'Touche l’écrin');
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    if (checkbox.checked) {
      // La lecture démarre grâce au toucher de l'utilisateur sur le couvercle.
      music.volume = 0.55;
      const playPromise = music.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => { musicRetry.hidden = true; })
          .catch(() => { musicRetry.hidden = false; });
      }
      if (!reduceMotion && animationId === null) animationId = requestAnimationFrame(drawParticles);
      else drawParticles();
    } else {
      music.pause();
      musicRetry.hidden = true;
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
      drawParticles();
    }
  }

  function openZoom() {
    if (!checkbox.checked) return;
    const svg = necklace.querySelector('svg');
    zoomNecklace.replaceChildren(svg.cloneNode(true));
    zoomView.classList.add('visible');
    zoomView.setAttribute('aria-hidden', 'false');
  }
  function closeZoom() {
    zoomView.classList.remove('visible');
    zoomView.setAttribute('aria-hidden', 'true');
  }

  necklace.addEventListener('click', openZoom);
  necklace.setAttribute('role', 'button');
  necklace.setAttribute('tabindex', '0');
  necklace.setAttribute('aria-label', 'Agrandir le collier et découvrir la photo');
  necklace.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openZoom();
    }
  });
  zoomClose.addEventListener('click', closeZoom);
  zoomView.addEventListener('click', event => {
    if (event.target === zoomView) closeZoom();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeZoom();
  });
  musicRetry.addEventListener('click', () => {
    music.play().then(() => { musicRetry.hidden = true; })
      .catch(() => { musicRetry.hidden = false; });
  });
  checkbox.addEventListener('change', () => {
    if (!checkbox.checked) closeZoom();
    updateOpening();
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && checkbox.checked && animationId === null && !reduceMotion) {
      animationId = requestAnimationFrame(drawParticles);
    }
  });
  window.addEventListener('resize', resizeCanvas, {passive: true});
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));
  resizeCanvas();
})();
</script>
</body>
</html>
